<div class='container mt-5'>
    <h3 class='mb-4'>Password Input Field</h3>

    <form id='passwordForm'>
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Label</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='passwordLabel' placeholder='Enter label'>
            </div>
        </div>

        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Title</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='passwordTitle' placeholder='Enter title'>
            </div>
        </div>

        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Placeholder</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='passwordPlaceholder' placeholder='Enter placeholder'>
            </div>
        </div>

        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Min Length</b></label>
            <div class='col-md-10'>
                <input type='number' class='form-control' id='passwordMinLength' placeholder='Enter min length'>
            </div>
        </div>

        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Max Length</b></label>
            <div class='col-md-10'>
                <input type='number' class='form-control' id='passwordMaxLength' placeholder='Enter max length'>
            </div>
        </div>

        <div class='form-group row'>
            <div class='col-md-2'><b>Required</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='passwordRequired'>
                <label class='form-check-label' for='passwordRequired'>Enable</label>
            </div>
        </div>
        <button type='submit' class='btn btn-primary float-right'> Save</button>
    </form>

    <h5 class='mt-5'>Live Preview:</h5>
    <div class='form-group mb-5'>
        <label id='previewPasswordLabel'><b>Label</b></label>
        <input type='password' class='form-control' id='previewPasswordInput'>
    </div>
</div>

<script>
    const previewPasswordInput = document.getElementById('previewPasswordInput');
    const previewPasswordLabel = document.getElementById('previewPasswordLabel');

    // Form fields
    const fields = {
        label: document.getElementById('passwordLabel'),
        title: document.getElementById('passwordTitle'),
        placeholder: document.getElementById('passwordPlaceholder'),
        minlength: document.getElementById('passwordMinLength'),
        maxlength: document.getElementById('passwordMaxLength'),
        required: document.getElementById('passwordRequired')
    };

    function updatePreview() {
        // Update label
        previewPasswordLabel.innerHTML = fields.label.value;

        // Update input attributes
        previewPasswordInput.title = fields.title.value || '';
        previewPasswordInput.placeholder = fields.placeholder.value || '';
        previewPasswordInput.minLength = fields.minlength.value || '';
        previewPasswordInput.maxLength = fields.maxlength.value || '';
        previewPasswordInput.required = fields.required.checked;
    }

    // Add event listeners
    Object.values(fields).forEach(field => {
        field.addEventListener('input', updatePreview);
        field.addEventListener('change', updatePreview);
    });

    // Initialize preview
    updatePreview();
</script>
