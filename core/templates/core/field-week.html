<div class='container mt-5'>
    <h3 class='mb-4'>Week Input Field</h3>

    <form id='weekForm'>
        <!-- Label -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Label</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='weekLabel' placeholder='Enter label'>
            </div>
        </div>

        <!-- Title -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Title</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='weekTitle' placeholder='Enter title'>
            </div>
        </div>

        <!-- Value -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Value</b></label>
            <div class='col-md-10'>
                <input type='week' class='form-control' id='weekValue'>
            </div>
        </div>

        <!-- Min -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Min</b></label>
            <div class='col-md-10'>
                <input type='week' class='form-control' id='weekMin'>
            </div>
        </div>

        <!-- Max -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Max</b></label>
            <div class='col-md-10'>
                <input type='week' class='form-control' id='weekMax'>
            </div>
        </div>

        <!-- Step -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Step (weeks)</b></label>
            <div class='col-md-10'>
                <input type='number' class='form-control' id='weekStep' placeholder='Enter step in weeks' value='1'>
            </div>
        </div>

        <!-- Readonly -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Readonly</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='weekReadonly'>
                <label class='form-check-label' for='weekReadonly'>Enable</label>
            </div>
        </div>

        <!-- Disabled -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Disabled</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='weekDisabled'>
                <label class='form-check-label' for='weekDisabled'>Enable</label>
            </div>
        </div>

        <!-- Required -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Required</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='weekRequired'>
                <label class='form-check-label' for='weekRequired'>Enable</label>
            </div>
        </div>
        <button type='submit' class='btn btn-primary float-right'> Save</button>

    </form>

    <h5 class='mt-5'>Live Preview:</h5>
    <div class='form-group mb-5'>
        <label id='previewWeekLabel'><b>Label</b></label>
        <input type='week' class='form-control' id='previewWeekInput'>
    </div>
</div>

<script>
    const previewWeek = document.getElementById('previewWeekInput');
    const previewWeekLabel = document.getElementById('previewWeekLabel');

    const fields = {
        label: document.getElementById('weekLabel'),
        title: document.getElementById('weekTitle'),
        value: document.getElementById('weekValue'),
        min: document.getElementById('weekMin'),
        max: document.getElementById('weekMax'),
        step: document.getElementById('weekStep'),
        readonly: document.getElementById('weekReadonly'),
        disabled: document.getElementById('weekDisabled'),
        required: document.getElementById('weekRequired')
    };

    function updateWeekPreview() {
        previewWeekLabel.innerHTML = fields.label.value;
        previewWeek.title = fields.title.value || '';
        previewWeek.value = fields.value.value || '';
        previewWeek.min = fields.min.value || '';
        previewWeek.max = fields.max.value || '';
        previewWeek.step = fields.step.value || 1;
        previewWeek.readOnly = fields.readonly.checked;
        previewWeek.disabled = fields.disabled.checked;
        previewWeek.required = fields.required.checked;
    }

    Object.values(fields).forEach(field => {
        field.addEventListener('input', updateWeekPreview);
        field.addEventListener('change', updateWeekPreview);
    });

    // Initialize preview
    updateWeekPreview();
</script>
