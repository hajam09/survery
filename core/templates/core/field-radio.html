<div class="container mt-5">
    <h3 class="mb-4">Radio Button Builder</h3>

    <form id="radioForm">
        <!-- Label -->
        <div class="form-group row">
            <label class="col-md-2 col-form-label"><b>Label</b></label>
            <div class="col-md-10">
                <input type="text" class="form-control" id="radioLabel" placeholder="Enter label">
            </div>
        </div>

        <!-- Title -->
        <div class="form-group row">
            <label class="col-md-2 col-form-label"><b>Title</b></label>
            <div class="col-md-10">
                <input type="text" class="form-control" id="radioTitle" placeholder="Enter title">
            </div>
        </div>

        <!-- Disabled -->
        <div class="form-group row">
            <div class="col-md-2"><b>Disabled</b></div>
            <div class="col-md-10 form-check">
                <input type="checkbox" class="form-check-input" id="radioDisabled">
                <label class="form-check-label" for="radioDisabled">Enable</label>
            </div>
        </div>

        <!-- Required -->
        <div class="form-group row">
            <div class="col-md-2"><b>Required</b></div>
            <div class="col-md-10 form-check">
                <input type="checkbox" class="form-check-input" id="radioRequired">
                <label class="form-check-label" for="radioRequired">Enable</label>
            </div>
        </div>

        <!-- Layout -->
        <div class="form-group row">
            <label class="col-md-2 col-form-label"><b>Layout</b></label>
            <div class="col-md-10">
                <select class="form-control" id="radioLayout">
                    <option value="vertical">Vertical</option>
                    <option value="horizontal">Horizontal</option>
                </select>
            </div>
        </div>

        <hr>

        <h5 class="mt-4">Options</h5>
        <div id="radioOptionContainer"></div>

        <button type="button" class="btn btn-secondary mt-2" id="addRadioOptionBtn">Add Option</button>
    </form>

    <hr>

    <h5 class="mt-4">Live Preview:</h5>
    <div class="form-group mb-5">
        <label id="previewRadioLabel"><b>Label</b></label>
        <div id="previewRadioContainer"></div>
    </div>
</div>

<script>
    const radioLabel = document.getElementById('radioLabel');
    const radioTitle = document.getElementById('radioTitle');
    const radioDisabled = document.getElementById('radioDisabled');
    const radioRequired = document.getElementById('radioRequired');
    const radioLayout = document.getElementById('radioLayout');
    const radioOptionContainer = document.getElementById('radioOptionContainer');
    const addRadioOptionBtn = document.getElementById('addRadioOptionBtn');
    const previewRadioLabel = document.getElementById('previewRadioLabel');
    const previewRadioContainer = document.getElementById('previewRadioContainer');

    let radioOptionCount = 0;
    const radioOptions = [];

    function createRadioOptionRow(index){
        const row = document.createElement('div');
        row.className = 'form-row align-items-center mb-2';
        row.id = 'radioOptionRow_' + index;

        // Option Text
        const colText = document.createElement('div');
        colText.className = 'col';
        const inputText = document.createElement('input');
        inputText.type = 'text';
        inputText.className = 'form-control';
        inputText.placeholder = 'Option text';
        inputText.dataset.index = index;
        colText.appendChild(inputText);

        // Option Value
        const colValue = document.createElement('div');
        colValue.className = 'col';
        const inputValue = document.createElement('input');
        inputValue.type = 'text';
        inputValue.className = 'form-control';
        inputValue.placeholder = 'Option value';
        inputValue.dataset.index = index;
        colValue.appendChild(inputValue);

        // Remove button
        const colRemove = document.createElement('div');
        colRemove.className = 'col-auto';
        const btnRemove = document.createElement('button');
        btnRemove.type = 'button';
        btnRemove.className = 'btn btn-danger';
        btnRemove.innerText = 'Remove';
        btnRemove.dataset.index = index;
        btnRemove.addEventListener('click', ()=>{
            radioOptionContainer.removeChild(row);
            radioOptions[index] = null;
            updateRadioPreview();
        });
        colRemove.appendChild(btnRemove);

        row.appendChild(colText);
        row.appendChild(colValue);
        row.appendChild(colRemove);

        // Store in options array
        radioOptions[index] = {text: '', value: ''};

        // Add listeners to update preview
        inputText.addEventListener('input', (e)=>{
            radioOptions[index].text = e.target.value;
            updateRadioPreview();
        });
        inputValue.addEventListener('input', (e)=>{
            radioOptions[index].value = e.target.value;
            updateRadioPreview();
        });

        radioOptionContainer.appendChild(row);
    }

    addRadioOptionBtn.addEventListener('click', ()=>{
        createRadioOptionRow(radioOptionCount++);
    });

    function updateRadioPreview(){
        previewRadioLabel.innerHTML = radioLabel.value;
        previewRadioContainer.innerHTML = '';
        const layout = radioLayout.value;

        radioOptions.forEach((opt, idx)=>{
            if(opt){
                const div = document.createElement('div');
                div.className = layout === 'horizontal' ? 'form-check form-check-inline' : 'form-check';

                const input = document.createElement('input');
                input.type = 'radio';
                input.className = 'form-check-input';
                input.name = 'dynamicRadio';
                input.id = 'dynamicRadio_' + idx;
                input.value = opt.value || opt.text || '';
                input.disabled = radioDisabled.checked;
                input.required = radioRequired.checked;

                const label = document.createElement('label');
                label.className = 'form-check-label';
                label.htmlFor = input.id;
                label.innerText = opt.text || 'Option';

                div.appendChild(input);
                div.appendChild(label);

                previewRadioContainer.appendChild(div);
            }
        });
    }

    // Event listeners for attributes
    [radioLabel, radioTitle, radioDisabled, radioRequired, radioLayout].forEach(el=>{
        el.addEventListener('input', updateRadioPreview);
        el.addEventListener('change', updateRadioPreview);
    });

    // Initialize with one option
    createRadioOptionRow(radioOptionCount++);
    updateRadioPreview();
</script>
