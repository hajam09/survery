<div class='container mt-5'>
    <h3 class='mb-4'>Select Dropdown Builder</h3>

    <form id='selectForm'>
        <!-- Label -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Label</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='selectLabel' placeholder='Enter label'>
            </div>
        </div>

        <!-- Title -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Title</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='selectTitle' placeholder='Enter title'>
            </div>
        </div>

        <!-- Disabled -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Disabled</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='selectDisabled'>
                <label class='form-check-label' for='selectDisabled'>Enable</label>
            </div>
        </div>

        <!-- Required -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Required</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='selectRequired'>
                <label class='form-check-label' for='selectRequired'>Enable</label>
            </div>

        </div>

        <h5 class='mt-4'>Options</h5>
        <div id='optionContainer'></div>

        <button type='button' class='btn btn-secondary mt-2' id='addOptionBtn'>Add Option</button>
        <button type='submit' class='btn btn-primary float-right'> Save</button>
    </form>

    <hr>

    <h5 class='mt-4'>Live Preview:</h5>
    <div class='form-group mb-5'>
        <label id='previewSelectLabel'><b>Label</b></label>
        <select class='form-control' id='previewSelect'></select>
    </div>
</div>

<script>
    const selectLabel = document.getElementById('selectLabel');
    const selectTitle = document.getElementById('selectTitle');
    const selectDisabled = document.getElementById('selectDisabled');
    const selectRequired = document.getElementById('selectRequired');
    const optionContainer = document.getElementById('optionContainer');
    const addOptionBtn = document.getElementById('addOptionBtn');
    const previewSelectLabel = document.getElementById('previewSelectLabel');
    const previewSelect = document.getElementById('previewSelect');

    let optionCount = 0;
    const options = [];

    function createOptionRow(index) {
        const row = document.createElement('div');
        row.className = 'form-row align-items-center mb-2';
        row.id = 'optionRow_' + index;

        // Option Text
        const colText = document.createElement('div');
        colText.className = 'col';
        const inputText = document.createElement('input');
        inputText.type = 'text';
        inputText.className = 'form-control';
        inputText.placeholder = 'Option text';
        inputText.dataset.index = index;
        colText.appendChild(inputText);

        // Option Value
        const colValue = document.createElement('div');
        colValue.className = 'col';
        const inputValue = document.createElement('input');
        inputValue.type = 'text';
        inputValue.className = 'form-control';
        inputValue.placeholder = 'Option value';
        inputValue.dataset.index = index;
        colValue.appendChild(inputValue);

        // Remove button
        const colRemove = document.createElement('div');
        colRemove.className = 'col-auto';
        const btnRemove = document.createElement('button');
        btnRemove.type = 'button';
        btnRemove.className = 'btn btn-danger';
        btnRemove.innerText = 'Remove';
        btnRemove.dataset.index = index;
        btnRemove.addEventListener('click', () => {
            optionContainer.removeChild(row);
            options[index] = null;
            updateSelectPreview();
        });
        colRemove.appendChild(btnRemove);

        row.appendChild(colText);
        row.appendChild(colValue);
        row.appendChild(colRemove);

        // Store in options array
        options[index] = {text: '', value: ''};

        // Add listeners to update preview
        inputText.addEventListener('input', (e) => {
            options[index].text = e.target.value;
            updateSelectPreview();
        });
        inputValue.addEventListener('input', (e) => {
            options[index].value = e.target.value;
            updateSelectPreview();
        });

        optionContainer.appendChild(row);
    }

    addOptionBtn.addEventListener('click', () => {
        createOptionRow(optionCount);
        optionCount++;
    });

    function updateSelectPreview() {
        previewSelectLabel.innerHTML = selectLabel.value;
        previewSelect.title = selectTitle.value || '';
        previewSelect.disabled = selectDisabled.checked;
        previewSelect.required = selectRequired.checked;

        // Clear all options
        previewSelect.innerHTML = '';

        options.forEach(opt => {
            if (opt) {
                const optionEl = document.createElement('option');
                optionEl.text = opt.text || 'Option';
                optionEl.value = opt.value || opt.text || '';
                previewSelect.appendChild(optionEl);
            }
        });
    }

    // Event listeners for attributes
    [selectLabel, selectTitle, selectDisabled, selectRequired].forEach(el => {
        el.addEventListener('input', updateSelectPreview);
        el.addEventListener('change', updateSelectPreview);
    });

    // Initialize with one option
    createOptionRow(optionCount++);
    updateSelectPreview();
</script>
