<div class='container mt-5'>
    <h3 class='mb-4'>Datetime-Local Input Field</h3>

    <form id='datetimeLocalForm'>
        <!-- Label -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Label</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='datetimeLocalLabel' placeholder='Enter label'>
            </div>
        </div>

        <!-- Title -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Title</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='datetimeLocalTitle' placeholder='Enter title'>
            </div>
        </div>

        <!-- Value -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Value</b></label>
            <div class='col-md-10'>
                <input type='datetime-local' class='form-control' id='datetimeLocalValue'>
            </div>
        </div>

        <!-- Min -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Min</b></label>
            <div class='col-md-10'>
                <input type='datetime-local' class='form-control' id='datetimeLocalMin'>
            </div>
        </div>

        <!-- Max -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Max</b></label>
            <div class='col-md-10'>
                <input type='datetime-local' class='form-control' id='datetimeLocalMax'>
            </div>
        </div>

        <!-- Step -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Step (seconds)</b></label>
            <div class='col-md-10'>
                <input type='number' class='form-control' id='datetimeLocalStep' placeholder='Enter step in seconds'
                       value='60'>
            </div>
        </div>

        <!-- Readonly -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Readonly</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='datetimeLocalReadonly'>
                <label class='form-check-label' for='datetimeLocalReadonly'>Enable</label>
            </div>
        </div>

        <!-- Disabled -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Disabled</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='datetimeLocalDisabled'>
                <label class='form-check-label' for='datetimeLocalDisabled'>Enable</label>
            </div>
        </div>

        <!-- Required -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Required</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='datetimeLocalRequired'>
                <label class='form-check-label' for='datetimeLocalRequired'>Enable</label>
            </div>
        </div>
        <button type='submit' class='btn btn-primary float-right'> Save</button>

    </form>

    <h5 class='mt-5'>Live Preview:</h5>
    <div class='form-group mb-5'>
        <label id='previewDatetimeLocalLabel'><b>Label</b></label>
        <input type='datetime-local' class='form-control' id='previewDatetimeLocalInput'>
    </div>
</div>

<script>
    const previewDatetimeLocal = document.getElementById('previewDatetimeLocalInput');
    const previewDatetimeLocalLabel = document.getElementById('previewDatetimeLocalLabel');

    const fields = {
        label: document.getElementById('datetimeLocalLabel'),
        title: document.getElementById('datetimeLocalTitle'),
        value: document.getElementById('datetimeLocalValue'),
        min: document.getElementById('datetimeLocalMin'),
        max: document.getElementById('datetimeLocalMax'),
        step: document.getElementById('datetimeLocalStep'),
        readonly: document.getElementById('datetimeLocalReadonly'),
        disabled: document.getElementById('datetimeLocalDisabled'),
        required: document.getElementById('datetimeLocalRequired')
    };

    function updateDatetimeLocalPreview() {
        previewDatetimeLocalLabel.innerHTML = fields.label.value;
        previewDatetimeLocal.title = fields.title.value || '';
        previewDatetimeLocal.value = fields.value.value || '';
        previewDatetimeLocal.min = fields.min.value || '';
        previewDatetimeLocal.max = fields.max.value || '';
        previewDatetimeLocal.step = fields.step.value || 60;
        previewDatetimeLocal.readOnly = fields.readonly.checked;
        previewDatetimeLocal.disabled = fields.disabled.checked;
        previewDatetimeLocal.required = fields.required.checked;
    }

    Object.values(fields).forEach(field => {
        field.addEventListener('input', updateDatetimeLocalPreview);
        field.addEventListener('change', updateDatetimeLocalPreview);
    });

    // Initialize preview
    updateDatetimeLocalPreview();
</script>
