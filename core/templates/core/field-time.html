<div class='container mt-5'>
    <h3 class='mb-4'>Time Input Field</h3>

    <form id='timeForm'>
        <!-- Label -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Label</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='timeLabel' placeholder='Enter label'>
            </div>
        </div>

        <!-- Title -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Title</b></label>
            <div class='col-md-10'>
                <input type='text' class='form-control' id='timeTitle' placeholder='Enter title'>
            </div>
        </div>

        <!-- Value -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Value</b></label>
            <div class='col-md-10'>
                <input type='time' class='form-control' id='timeValue'>
            </div>
        </div>

        <!-- Min -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Min</b></label>
            <div class='col-md-10'>
                <input type='time' class='form-control' id='timeMin'>
            </div>
        </div>

        <!-- Max -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Max</b></label>
            <div class='col-md-10'>
                <input type='time' class='form-control' id='timeMax'>
            </div>
        </div>

        <!-- Step -->
        <div class='form-group row'>
            <label class='col-md-2 col-form-label'><b>Step (seconds)</b></label>
            <div class='col-md-10'>
                <input type='number' class='form-control' id='timeStep' placeholder='Enter step in seconds' value='60'>
            </div>
        </div>

        <!-- Readonly -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Readonly</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='timeReadonly'>
                <label class='form-check-label' for='timeReadonly'>Enable</label>
            </div>
        </div>

        <!-- Disabled -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Disabled</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='timeDisabled'>
                <label class='form-check-label' for='timeDisabled'>Enable</label>
            </div>
        </div>

        <!-- Required -->
        <div class='form-group row'>
            <div class='col-md-2'><b>Required</b></div>
            <div class='col-md-10 form-check'>
                <input type='checkbox' class='form-check-input' id='timeRequired'>
                <label class='form-check-label' for='timeRequired'>Enable</label>
            </div>
        </div>
        <button type='submit' class='btn btn-primary float-right'> Save</button>

    </form>

    <h5 class='mt-5'>Live Preview:</h5>
    <div class='form-group mb-5'>
        <label id='previewTimeLabel'><b>Label</b></label>
        <input type='time' class='form-control' id='previewTimeInput'>
    </div>
</div>

<script>
    const previewTime = document.getElementById('previewTimeInput');
    const previewTimeLabel = document.getElementById('previewTimeLabel');

    const fields = {
        label: document.getElementById('timeLabel'),
        title: document.getElementById('timeTitle'),
        value: document.getElementById('timeValue'),
        min: document.getElementById('timeMin'),
        max: document.getElementById('timeMax'),
        step: document.getElementById('timeStep'),
        readonly: document.getElementById('timeReadonly'),
        disabled: document.getElementById('timeDisabled'),
        required: document.getElementById('timeRequired')
    };

    function updateTimePreview() {
        previewTimeLabel.innerHTML = fields.label.value;
        previewTime.title = fields.title.value || '';
        previewTime.value = fields.value.value || '';
        previewTime.min = fields.min.value || '';
        previewTime.max = fields.max.value || '';
        previewTime.step = fields.step.value || 60;
        previewTime.readOnly = fields.readonly.checked;
        previewTime.disabled = fields.disabled.checked;
        previewTime.required = fields.required.checked;
    }

    Object.values(fields).forEach(field => {
        field.addEventListener('input', updateTimePreview);
        field.addEventListener('change', updateTimePreview);
    });

    // Initialize preview
    updateTimePreview();
</script>
